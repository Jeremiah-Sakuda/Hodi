name: verify-live

# LIVE release verification (HOD-720). Everything verify.yml deliberately
# excludes because it needs credentials or the deployed service, run on
# demand against a real environment — and, crucially, WRITING ITS RESULT to
# docs/deployment_status.json so the repository's deployment claims are
# derived from a verification run rather than from memory.
#
# WHY IT IS SEPARATE. verify.yml is credential-free by construction and must
# stay that way: it is the proof that a judge can clone and run everything.
# This workflow is the other half — the proof that what is DEPLOYED does what
# the deployed-path claims say.
#
# WHY workflow_dispatch AND NOT push. It costs money, it writes to real
# collections, and it must not run from a fork. A release is a decision.
#
# NO LONG-LIVED KEYS. Authentication is Workload Identity Federation: GitHub's
# OIDC token is exchanged for short-lived Google credentials. A service-account
# JSON key in a repository secret would be the same defect class this project
# spends its time removing — a credential that outlives its purpose.
#
# STATUS: authored, NEVER EXECUTED. The WIF pool, provider and repository
# secrets do not exist yet, so this workflow has never run and
# docs/deployment_status.json does not claim it has. Setting it up is the
# remaining work; the job definition is not.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to verify"
        required: true
        default: staging
        type: choice
        options: [staging, production]
      write_status:
        description: "Write results back to docs/deployment_status.json"
        required: true
        default: true
        type: boolean

permissions:
  contents: write      # to commit the regenerated deployment status
  id-token: write      # to mint the GitHub OIDC token WIF exchanges

concurrency:
  group: verify-live-${{ inputs.environment }}
  cancel-in-progress: false   # never interrupt a run mid-write to real collections

jobs:
  verify-live:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # required reviewers gate production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: pip install -r src/evidence_service/requirements.lock

      # Short-lived credentials only. No JSON key exists to leak.
      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.VERIFIER_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      # --- the four things the offline suite structurally cannot prove ---

      - name: Boundary proof against the deployed service
        run: make demo-live
        env:
          HODI_SERVICE_URL: ${{ vars.HODI_SERVICE_URL }}

      - name: Live manifest and corpus integrity
        run: make verify-manifest
        env:
          HODI_SERVICE_URL: ${{ vars.HODI_SERVICE_URL }}

      - name: Live Firestore and IAM suite
        run: HODI_E2E=1 python3 -m unittest discover -s tests -v
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

      # CI VERIFIES. IT DOES NOT SIGN.
      #
      # This step originally had CI sign a receipt with the production key and
      # then check its own signature. That required roles/cloudkms.signer on the
      # CI identity — the power to forge any Hodi receipt — to prove a closed
      # loop that says nothing about the deployed service. The verifier holds
      # publicKeyViewer only, and proves the two things a recipient actually
      # depends on:
      #
      #   1. the public key the service ADVERTISES is byte-identical to the one
      #      KMS holds, so the service cannot be substituting a key it controls;
      #   2. a REAL notice the deployed service issued still verifies under that
      #      key, and one changed byte does not.
      #
      # (2) also catches a key version rotated away from already-published
      # receipts, which would silently invalidate every provenance claim made.
      - name: KMS public key and a production signature, verified without signing power
        run: |
          set -euo pipefail
          gcloud kms keys versions get-public-key 1 \
            --key "${{ vars.KMS_KEY }}" --keyring "${{ vars.KMS_KEYRING }}" \
            --location "${{ vars.KMS_LOCATION }}" --project "${{ vars.GCP_PROJECT_ID }}" \
            --output-file /tmp/kms-public-key.pem
          curl -fsS "${{ vars.HODI_SERVICE_URL }}/verification-key" \
            | python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['public_key_pem'])" \
            > /tmp/served-public-key.pem
          python3 - <<'PY'
          import sys
          def norm(p):
              return "".join(open(p).read().split())
          kms, served = norm("/tmp/kms-public-key.pem"), norm("/tmp/served-public-key.pem")
          if kms != served:
              sys.exit("/verification-key does not serve the KMS public key — a recipient "
                       "verifying against the advertised key would be verifying against "
                       "something this service chose, not something KMS holds.")
          print("advertised public key is byte-identical to the KMS key: PASS")
          PY
          python3 - <<'PY'
          import json
          doc = json.load(open("fixtures/production_signed_notice.json"))["notice"]
          json.dump(doc, open("/tmp/notice.json", "w"))
          doc["counterparty_id"] = "tampered-labs"
          json.dump(doc, open("/tmp/notice-bad.json", "w"))
          PY
          python3 scripts/hodi_verify.py /tmp/notice.json --key /tmp/kms-public-key.pem
          if python3 scripts/hodi_verify.py /tmp/notice-bad.json --key /tmp/kms-public-key.pem; then
            echo "a tampered notice VERIFIED — the signature check is not checking." >&2
            exit 1
          fi
          echo "production notice verifies; tampered copy does not: PASS"

      # --- the result becomes the repository's deployment truth ---

      - name: Record the verification in docs/deployment_status.json
        if: ${{ inputs.write_status && inputs.environment == 'production' }}
        run: |
          python3 scripts/record_live_verification.py \
            --revision "$(gcloud run services describe ${{ vars.HODI_SERVICE }} \
                          --region ${{ vars.HODI_REGION }} --project ${{ vars.GCP_PROJECT_ID }} \
                          --format='value(status.latestReadyRevisionName)')" \
            --verified evidence_endpoint append_only_runtime_identity \
                       cross_buyer_boundary_over_network kms_signing \
                       per_domain_databases live_release_verification
          # The README table is GENERATED from that JSON. Recording a promotion
          # without regenerating it leaves the README showing the old state and
          # the old date — so the regeneration is part of the write, and
          # check_doc_metrics.py fails the job if the two ever disagree.
          python3 scripts/deployment_status.py --write-readme
          python3 scripts/deployment_status.py --check
          python3 scripts/check_doc_metrics.py

      - name: Commit the updated deployment status
        if: ${{ inputs.write_status && inputs.environment == 'production' }}
        run: |
          git config user.name "hodi-live-verifier"
          git config user.email "noreply@github.com"
          git add docs/deployment_status.json README.md
          git diff --staged --quiet || git commit -m "chore: record live verification $(date -u +%FT%TZ)"
          git push
